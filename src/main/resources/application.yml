server:
  port: 5002

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/job-finder}
    username: ${SPRING_DATASOURCE_USERNAME:job_finder_user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:redis://localhost:6379}

app:
  jwt:
    access-token-secret: ${APP_JWT_ACCESS_TOKEN_SECRET}
    access-token-expires-in: 15m
    refresh-token-secret: ${APP_JWT_REFRESH_TOKEN_SECRET}
    refresh-token-expires-in: 7d
  cors:
    origin: ${APP_CORS_ORIGIN:http://localhost:3000}
  queue:
    concurrency: ${APP_QUEUE_CONCURRENCY:5}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Job Finder Backend
    version: 1.0.0
  java:
    version: ${java.version}
