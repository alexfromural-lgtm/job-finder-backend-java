syntax = "proto3";

package jobfinder;

import "common.proto";

option java_package         = "com.jobfinder.grpc.proto";
option java_outer_classname = "JobProto";
option java_multiple_files  = true;

// -----------------------------------------------------------------------
// Job service — mirrors /api/jobs
//
// ListJobs uses SERVER-SIDE STREAMING: the server pushes each JobMessage
// one at a time as it fetches from the DB, demonstrating gRPC streaming.
//
// All RPCs except ListJobs and GetJob require RECRUITER role.
// Requires "authorization: Bearer <access_token>" metadata for secured RPCs.
// -----------------------------------------------------------------------

service JobService {
  // Stream all jobs matching the filter (server-side streaming demo).
  // Public — no auth required.
  rpc ListJobs (ListJobsRequest) returns (stream JobMessage);

  // Fetch a single job by ID.  Public.
  rpc GetJob (JobIdRequest) returns (JobMessage);

  // Create a new job posting.  Requires RECRUITER role.
  rpc CreateJob (CreateJobRequest) returns (JobMessage);
}

// -----------------------------------------------------------------------
// Request / Response messages
// -----------------------------------------------------------------------

message ListJobsRequest {
  string category = 1;   // optional filter
  string location = 2;   // optional filter
  string search   = 3;   // optional full-text filter
  int32  page     = 4;   // 1-based, default 1
  int32  page_size = 5;  // default 10, max 100
}

message JobIdRequest {
  string job_id = 1;   // UUID string
}

message CreateJobRequest {
  string title        = 1;
  string description  = 2;
  string requirements = 3;
  string location     = 4;
  string salary_range = 5;
  string category     = 6;
}

message JobMessage {
  string job_id         = 1;
  string recruiter_id   = 2;
  string company_name   = 3;
  string industry       = 4;
  string company_website = 5;
  string title          = 6;
  string description    = 7;
  string requirements   = 8;
  string location       = 9;
  string salary_range   = 10;
  string category       = 11;
  bool   is_active      = 12;
  string created_at     = 13;  // ISO-8601
  string updated_at     = 14;  // ISO-8601
}
