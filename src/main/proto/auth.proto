syntax = "proto3";

package jobfinder;

import "common.proto";

option java_package         = "com.jobfinder.grpc.proto";
option java_outer_classname = "AuthProto";
option java_multiple_files  = true;

// -----------------------------------------------------------------------
// Auth service — mirrors /api/auth (login + me only for gRPC demo)
//
// Authentication:
//   - Login RPC  → no auth required
//   - GetCurrentUser RPC → requires "authorization: Bearer <access_token>"
//                          in the gRPC call metadata
// -----------------------------------------------------------------------

service AuthService {
  // Login with email + password.
  // Returns userId, roles, and a fresh access token in the response
  // (gRPC has no cookie jar; token is returned in the response body).
  rpc Login (LoginRequest) returns (LoginResponse);

  // Fetch the authenticated user's profile.
  // Requires Authorization metadata header.
  rpc GetCurrentUser (Empty) returns (UserResponse);
}

// -----------------------------------------------------------------------
// Request / Response messages
// -----------------------------------------------------------------------

message LoginRequest {
  string email    = 1;
  string password = 2;
}

message LoginResponse {
  string user_id     = 1;   // UUID string
  repeated string roles = 2;
  string access_token = 3;  // JWT — use in subsequent gRPC calls via metadata
}

message UserResponse {
  string          user_id    = 1;
  string          name       = 2;
  string          email      = 3;
  repeated string roles      = 4;
  bool            is_active  = 5;
  string          created_at = 6;  // ISO-8601
  string          updated_at = 7;  // ISO-8601
}
