spring:
  datasource:
    # Testcontainers injects these via @DynamicPropertySource — no static URL needed
    url: jdbc:postgresql://localhost:5432/test
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      url: redis://localhost:6379

app:
  jwt:
    access-token-secret: test-access-secret-minimum-32-characters-long!!
    refresh-token-secret: test-refresh-secret-minimum-32-characters-long!!
  cors:
    origin: http://localhost:3000
  queue:
    concurrency: 1    # single worker thread keeps tests deterministic

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always   # always show details in test assertions
